  <script>
    /* Apply saved theme / text size before first paint (no flash). */
    (function () {
      try {
        var g = function (k, d) { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); };
        var t = g('mt.theme', 'auto'), r = document.documentElement;
        if (t !== 'auto') r.setAttribute('data-theme', t);
        r.setAttribute('data-fs', String(g('mt.fs', 100)));
        if (g('mt.contrast', false)) r.setAttribute('data-contrast', 'high');
        if (g('mt.motion', false)) r.setAttribute('data-motion', 'reduce');
      } catch (e) {}
    })();
  </script>
