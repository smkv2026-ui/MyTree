<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline — MyTree</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#f6f4ec;color:#1d2b24;padding:24px;text-align:center}
@media (prefers-color-scheme:dark){body{background:#0e1a15;color:#e6efe9}}h1{font-size:1.5rem;margin:.5rem 0}a,button{display:inline-block;margin-top:1rem;padding:.7rem 1.2rem;border-radius:12px;border:0;background:#237d49;color:#fff;font:inherit;text-decoration:none;cursor:pointer}</style></head>
<body><main><svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ad28a"/><stop offset="1" stop-color="#1f8a50"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0f3d2e"/>
  <!-- heart-shaped canopy: the tree's love for its friend -->
  <path d="M27 36C10 27 9 9 21 8c4 0 6 2.500 6 5 0-2.500 2-5 6-5 12 1 11 19-6 28z" transform="translate(-1 1)" fill="url(#gb)"/>
  <path d="M19 15c3-3 7-3 9 0" fill="none" stroke="#bdf0d3" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <!-- trunk with a reaching branch -->
  <path d="M26 33v21" stroke="#c8a27a" stroke-width="5" stroke-linecap="round"/>
  <path d="M26 45c5-1 8-3.500 11-5.500" fill="none" stroke="#c8a27a" stroke-width="3.200" stroke-linecap="round"/>
  <path d="M20 54h12" stroke="#c8a27a" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <!-- child, hand in hand with the branch -->
  <circle cx="46" cy="36" r="4.300" fill="#f4ecd8"/>
  <path d="M46 41.500V51" stroke="#e3c25a" stroke-width="5.200" stroke-linecap="round"/>
  <path d="M46 44.500c-2.500.2-5-1-8-4.500" fill="none" stroke="#e3c25a" stroke-width="3" stroke-linecap="round"/>
  <path d="M43.500 53.500l-.8 3.500M48.500 53.500l.8 3.500" stroke="#e3c25a" stroke-width="3" stroke-linecap="round"/>
  <!-- the spark where hand meets branch -->
  <circle cx="37.500" cy="39.800" r="2.400" fill="#ffd966"/>
  <path d="M37.500 34.800v-1.800M32.800 37.500l-1.400-1M42.200 37.500l1.400-1" stroke="#ffd966" stroke-width="1.400" stroke-linecap="round"/>
</svg>
<h1>You’re offline</h1><p>Your trees are safe. Pages you have already opened still work; anything you save will sync when you are back online.</p><button onclick="location.reload()">Try again</button></main></body></html>
